Description: AWS CloudFormation sample template for deploying Redmine with plugins
Parameters:
  KeyName:
    Description: EC2 key pair name
    Type: String
  Subnet:
    Description: Existing VPC subnet to use for redmine
    Type: String
  InstanceType:
    Description: EC2 instance type of the server
    Type: String
    Default: t3.micro
  SESUsername:
    Description: The SES SMTP user name to use for outgoing email
    Type: String
  SESPassword:
    Description: The SES SMTP password to use for outgoing email
    Type: String
  EmailDomain:
    Description: The domain name from which redmine will send email
    Type: String
  UseLoadBalancer:
    Description: Whether to use a load balancer or deploy an internal reverse proxy. This is mostly related to HTTPS configuration.
    Type: String
    Default: yes
  CertificateId:
    Description: Existing HTTPS certifiate to use for the load balance
    Type: String
    Default: ''

Conditions: 
  EnableELB: !Equals [ !Ref UseLoadBalancer, yes ]
  DisableELB: !Not [ { Condition: EnableELB } ]
  UseUnsecureELB: !And [ { Condition: EnableELB }, !Equals [ !Ref CertificateId, "" ] ]
  UseSecureELB: !And [ { Condition: EnableELB }, !Not [ !Equals [ !Ref CertificateId, "" ] ] ]

Include:
  - ubuntu-images

Resources:
  RedmineSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "RedmineSecurity-${AWS::StackName}"
      GroupDescription: Allow access to redmine
      SecurityGroupIngress:
        - { CidrIp: 0.0.0.0/0, FromPort: -1, ToPort: -1, IpProtocol: icmp }
        - { CidrIp: 0.0.0.0/0, FromPort: 22, ToPort: 22, IpProtocol: tcp }
        - { CidrIp: 0.0.0.0/0, FromPort: 80, ToPort: 80, IpProtocol: tcp }
        - { CidrIp: 0.0.0.0/0, FromPort: 443, ToPort: 443, IpProtocol: tcp }

  RedmineStorageSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "RedmineStorageSecurity-${AWS::StackName}"
      GroupDescription: Give redmine access to EFS
      SecurityGroupIngress:
        - CidrIp: 0.0.0.0/0
          FromPort: -1
          ToPort: -1
          IpProtocol: icmp
        - SourceSecurityGroupId:
            Fn::GetAtt: RedmineSecurityGroup.GroupId
          FromPort: 2049
          ToPort: 2049
          IpProtocol: tcp

  RedmineLT:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        BlockDeviceMappings:
          - DeviceName: "/dev/sda1"
            Ebs:
              VolumeType: gp3
              DeleteOnTermination: true
              VolumeSize: 15
        ImageId: !FindInMap [ UbuntuRegionImages, { Ref: "AWS::Region" }, jammy ]
        InstanceType: !Ref InstanceType
        KeyName: !Ref KeyName
        NetworkInterfaces:
          - DeviceIndex: 0
            AssociatePublicIpAddress: true
#            Ipv6AddressCount: 1
            Groups:
              - !GetAtt RedmineSecurityGroup.GroupId
        UserData:
          Fn::Base64:
            Fn::Join:
            - ""
            - - "#!/bin/bash -xe\n"
              - "apt update && apt install -y python-setuptools\n"
              - "python2 /usr/lib/python2.7/dist-packages/easy_install.py https://s3.amazonaws.com/cloudformation-examples/aws-cfn-bootstrap-latest.tar.gz\n"
              - "cfn-init -v --stack "
              - Ref: AWS::StackName
              - " --resource Redmine --configsets Install --region "
              - Ref: AWS::Region
              - "\n"
              - "echo 11 > /etc/instance-count\n"

  Redmine:
    Type: AWS::EC2::Instance
    Metadata:
      AWS::CloudFormation::Init:
        configSets:
          Install: [ setup, systemfiles, deployfromefs, install ]
        setup:
          packages:
            apt:
              docker-compose: []
              docker.io: []
              postfix: []
              nfs-common: []
              rsync: []
        systemfiles:
          files:
            /etc/systemd/system/efs.mount:
              content:
                Fn::Sub: |
                  [Unit]
                  Description=Redmine EFS
                  After=network.target network-online.target
                  Wants=network-online.target
                  [Mount]
                  What=${Storage.FileSystemId}.efs.${AWS::Region}.amazonaws.com:/
                  Where=/efs
                  Type=nfs4
                  Options=nfsvers=4.1,rsize=1048576,wsize=1048576,hard,timeo=600,retrans=2,noresvport
                  [Install]
                  WantedBy=multi-user.target
              mode: "000644"
              owner: root
              group: root
            /etc/systemd/system/redmine.service:
              content: |
                [Unit]
                Description=Redmine
                [Service]
                EnvironmentFile=-/etc/default/redmine-configuration
                ExecStartPre=/bin/bash -c 'echo "SMTP_SERVER=$(curl http://169.254.169.254/latest/meta-data/local-ipv4)" > /etc/default/redmine-configuration'
                ExecStartPre=/bin/bash -c 'curl -L https://github.com/cloudonix/redmine-compose/archive/master.tar.gz | tar -C /usr/share -zx --xform=s,redmine-compose-master,docker-redmine,'
                ExecStartPre=/bin/bash -c '/usr/bin/perl -pi -e "s/example.com/$(cat /etc/default/redmine-domain)/" /usr/share/docker-redmine/configuration.yml'
                ExecStart=/usr/bin/docker-compose -p redmine -f /usr/share/docker-redmine/docker-compose.yml up
                ExecReload=/usr/bin/docker-compose -p redmine -f /usr/share/docker-redmine/docker-compose.yml pull
                ExecReload=/usr/bin/docker-compose -p redmine -f /usr/share/docker-redmine/docker-compose.yml restart
                ExecStop=/usr/bin/docker-compose -p redmine -f /usr/share/docker-redmine/docker-compose.yml down
                Restart=on-failure
                KillSignal=SIGINT
                KillMode=process
                [Install]
                WantedBy=multi-user.target
              mode: "000644"
              owner: root
              group: root
            /etc/postfix/sasl_passwd:
              content:
                Fn::Sub: >
                  [email-smtp.${AWS::Region}.amazonaws.com]:25 ${SESUsername}:${SESPassword}
            /etc/default/redmine-domain:
              content: !Ref EmailDomain
          commands:
            refresh-system:
              command: /bin/systemctl daemon-reload
        deployfromefs:
          commands:
            1_mountefs:
              command: /bin/systemctl enable --now efs.mount
            2_deploy:
              command: while ![ -d /efs/redmine ]; do sleep 5; done; rsync -a /efs/redmine/etc/ /etc/redmine/
        install:
          commands:
            1_start-redmine:
              command: /bin/systemctl enable --now redmine.service
            2_postfix:
              command:
                Fn::Sub: >
                  postconf -e "mynetworks=127.0.0.0/8 [::ffff:127.0.0.0]/104 [::1]/128 172.16.0.0/12" \
                            "relayhost=[email-smtp.${AWS::Region}.amazonaws.com]:25" \
                            "smtp_sasl_auth_enable=yes" \
                            "smtp_sasl_security_options=noanonymous" \
                            "smtp_sasl_password_maps=hash:/etc/postfix/sasl_passwd" \
                            "smtp_use_tls=yes" \
                            "smtp_tls_security_level=encrypt" \
                            "smtp_tls_note_starttls_offer=yes" \
                            "smtp_tls_CAfile=/etc/ssl/certs/ca-certificates.crt"
            3_postfix-ses-cred:
              command: postmap hash:/etc/postfix/sasl_passwd
            4_restart-postfix:
              command: /bin/systemctl restart postfix.service
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref RedmineLT
        Version: !GetAtt RedmineLT.LatestVersionNumber
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}

  Storage:
    Type: AWS::EFS::FileSystem
    Properties:
      Encrypted: false
      BackupPolicy:
        Status: ENABLED
      LifecyclePolicies:
        - TransitionToIA: AFTER_7_DAYS
      FileSystemTags:
        - Key: Name
          Value: redmine-stack-storage

  StorageAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref Storage
      RootDirectory:
        Path: "/"
      AccessPointTags:
        - Key: Name
          Value: redis-stack-storage

  StorageMountPoint:
    Type: AWS::EFS::MountTarget
    Properties: 
      FileSystemId: !Ref Storage
      SecurityGroups: 
        - !GetAtt RedmineStorageSecurityGroup.GroupId
      SubnetId: !Ref Subnet

  RedmineLoadBalancer:
    Type: AWS::ElasticLoadBalancing::LoadBalancer
    Condition: UseUnsecureELB
    Properties:
      HealthCheck:
        Interval: 30
        Timeout: 5
        Target: HTTP:80/login
        HealthyThreshold: 2
        UnhealthyThreshold: 2
      Instances:
        - !Ref Redmine
      LoadBalancerName: !Sub ${AWS::StackName}-lb
      AvailabilityZones:
        - !GetAtt Redmine.AvailabilityZone
      Listeners:
        - { InstancePort: 80, InstanceProtocol: http, LoadBalancerPort: 80, Protocol: http }
        - InstancePort: 80
          InstanceProtocol: http
          LoadBalancerPort: 443
          Protocol: https
          PolicyNames: 
            - My-TLSNegotiation-Policy
          SSLCertificateId: !Sub "arn:aws:acm:${AWS::Region}:756645658314:certificate/${CertificateId}"
      Policies:
        - PolicyName: My-TLSNegotiation-Policy
          PolicyType: SSLNegotiationPolicyType
          Attributes:
            - Name: Reference-Security-Policy
              Value: ELBSecurityPolicy-TLS-1-2-2017-01
      SecurityGroups:
        - !GetAtt RedmineSecurityGroup.GroupId

  RedmineLoadBalancerTLS:
    Type: AWS::ElasticLoadBalancing::LoadBalancer
    Condition: UseSecureELB
    Properties:
      HealthCheck:
        Interval: 30
        Timeout: 5
        Target: HTTP:80/login
        HealthyThreshold: 2
        UnhealthyThreshold: 2
      Instances:
        - !Ref Redmine
      LoadBalancerName: !Sub ${AWS::StackName}-securelb
      AvailabilityZones:
        - !GetAtt Redmine.AvailabilityZone
      Listeners:
        - { InstancePort: 80, InstanceProtocol: http, LoadBalancerPort: 80, Protocol: http }
        - InstancePort: 80
          InstanceProtocol: http
          LoadBalancerPort: 443
          Protocol: https
          PolicyNames: 
            - My-TLSNegotiation-Policy
          SSLCertificateId: !Sub "arn:aws:acm:${AWS::Region}:756645658314:certificate/${CertificateId}"
      Policies:
        - PolicyName: My-TLSNegotiation-Policy
          PolicyType: SSLNegotiationPolicyType
          Attributes:
            - Name: Reference-Security-Policy
              Value: ELBSecurityPolicy-TLS-1-2-2017-01
      SecurityGroups:
        - !GetAtt RedmineSecurityGroup.GroupId

Outputs:
  ServerAddress:
    Description: The DNS address of the Redmine server
    Value:
      Fn::GetAtt: Redmine.PublicDnsName
    Export:
      Name: !Sub "${AWS::StackName}-host"
  LoadBalancerAddress:
    Condition: UseUnsecureELB
    Description: The DNS address of the Redmine load balancer
    Value:
      Fn::GetAtt: RedmineLoadBalancer.DNSName
    Export:
      Name: !Sub "${AWS::StackName}-loadbalancer"
  LoadBalancerSecureAddress:
    Condition: UseSecureELB
    Description: The DNS address of the Redmine load balancer
    Value:
      Fn::GetAtt: RedmineLoadBalancerTLS.DNSName
    Export:
      Name: !Sub "${AWS::StackName}-loadbalancer"
